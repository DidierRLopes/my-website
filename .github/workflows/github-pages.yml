name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Check image sizes
        run: |
          large=$(find static -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) -size +2M)
          if [ -n "$large" ]; then
            echo "::error::Images over 2MB. Resize/compress them before committing:"
            echo "$large"
            exit 1
          fi

      - name: Build website
        run: yarn build

      # Tar the site first: artifact uploads reject some valid filenames
      # (e.g. ':' in the Pokemon card images). Runs on PRs too, so the
      # deploy hand-off is exercised before reaching main.
      - name: Package build
        run: tar -cf site.tar -C build .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    concurrency:
      group: deploy-${{ github.ref }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site

      - name: Unpack build
        run: mkdir build && tar -xf site.tar -C build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
